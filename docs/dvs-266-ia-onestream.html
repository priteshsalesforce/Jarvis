<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Jarvis — Concept C · One living stream (full system)</title>
<style>
  :root {
    --sf-blue:#0176D3; --sf-blue-dark:#032D60; --accent:#FE9339; --accent-2:#06A59A;
    --ink:#16325C; --ink-soft:#54698D; --bg:#EEF3F9; --panel:#FFFFFF; --line:#DCE4EF;
    --good:#2E844A; --red:#BA0517; --jarvis:#5B4BBE;
    --shadow:0 6px 24px rgba(3,45,96,.10); --shadow-lg:0 14px 44px rgba(3,45,96,.16);
    --font:-apple-system,"Segoe UI","Salesforce Sans",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;font-family:var(--font);color:var(--ink);background:var(--bg)}
  body{overflow-y:auto}
  .hide{display:none!important}

  /* top bar */
  .topbar{height:56px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 18px;gap:10px;position:sticky;top:0;z-index:40}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.05rem;color:var(--sf-blue-dark);cursor:pointer}
  .core{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#8E7BF0,#5B4BBE 70%);box-shadow:0 0 0 4px rgba(91,75,190,.15);animation:breathe 3.4s ease-in-out infinite}
  @keyframes breathe{0%,100%{box-shadow:0 0 0 4px rgba(91,75,190,.12)}50%{box-shadow:0 0 0 7px rgba(91,75,190,.22)}}
  .spacer{flex:1}
  .iconbtn{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;cursor:pointer;color:var(--ink-soft)}
  .iconbtn:hover{background:#F0F5FB}
  .chip{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:999px;font-weight:700;font-size:.84rem;cursor:pointer;border:1px solid var(--line)}
  .chip.autopilot{background:#E9FBF2;color:#0A6E45;border-color:#BFEAD4}
  .chip.autopilot:hover{background:#DBF6E8}
  .chip.cando{background:#EEF4FF;color:var(--sf-blue-dark);border-color:#CFE0F4}
  .chip.cando:hover{background:#E2ECFB}
  .chip.notes{background:var(--accent);color:#3d2200;border:none}

  /* generic column */
  .col{max-width:740px;margin:0 auto;padding:26px 20px 130px}

  /* status / all-clear */
  .status h1{font-size:clamp(1.4rem,2.4vw,1.95rem);font-weight:800;color:var(--sf-blue-dark);line-height:1.18}
  .status p{color:var(--ink-soft);font-size:1.02rem;margin-top:7px}
  .allclear{background:linear-gradient(180deg,#F2FCF7,#fff);border:1px solid #C9EAD8;border-radius:18px;padding:26px;text-align:center;box-shadow:var(--shadow)}
  .allclear .big{font-size:1.5rem;font-weight:800;color:#0A6E45}
  .allclear p{color:var(--ink-soft);margin-top:8px}

  .seclabel{font-size:.72rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-soft);margin:26px 0 12px;display:flex;align-items:center;gap:8px}
  .seclabel .ct{background:#E5EEF8;color:var(--sf-blue-dark);border-radius:999px;padding:1px 8px;font-size:.72rem}

  /* lifecycle card */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden;transition:all .3s ease}
  .card.click{cursor:pointer}
  .card.click:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
  .chead{display:flex;align-items:flex-start;gap:12px;padding:16px 18px}
  .jdot{width:30px;height:30px;flex:none;border-radius:50%;background:radial-gradient(circle at 35% 30%,#8E7BF0,#5B4BBE 70%);display:grid;place-items:center;color:#fff;font-weight:800;font-size:.78rem}
  .ctitle{font-weight:700;font-size:1.02rem;color:var(--ink);line-height:1.35}
  .csub{font-size:.88rem;color:var(--ink-soft);margin-top:4px;line-height:1.45}
  .statepill{margin-left:auto;flex:none;font-size:.62rem;font-weight:800;letter-spacing:.05em;padding:4px 9px;border-radius:999px;text-transform:uppercase;white-space:nowrap}
  .card.needs{border-left:5px solid var(--accent)} .card.needs.urgent{border-left-color:var(--red)}
  .statepill.needs{background:#FEF0E0;color:#9A5800}
  .card.waityou{border-left:5px solid var(--accent)}
  .statepill.waityou{background:#FEF0E0;color:#9A5800}
  .card.inflight{border-left:5px solid var(--sf-blue)}
  .statepill.inflight{background:#E1F0FC;color:#0B5CAB;display:inline-flex;align-items:center;gap:6px}
  .card.tracking{border-left:5px solid var(--accent-2)}
  .statepill.tracking{background:#D7F2EE;color:#0A6E66;display:inline-flex;align-items:center;gap:6px}
  .pulse{width:8px;height:8px;border-radius:50%;background:currentColor;animation:pulse 1.1s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.25)}}
  .progress{height:4px;background:#E5EEF8;border-radius:4px;margin:2px 18px 16px;overflow:hidden}
  .progress .bar{height:100%;background:var(--sf-blue);border-radius:4px;animation:grow 2.2s ease-in-out infinite alternate}
  @keyframes grow{from{width:30%}to{width:80%}}
  .cfoot{display:flex;align-items:center;gap:10px;padding:13px 18px;border-top:1px solid #EEF2F8;background:#FAFCFE;flex-wrap:wrap}
  .gatehint{margin-left:auto;font-size:.78rem;color:var(--ink-soft)}

  .btn{padding:9px 15px;border-radius:9px;font-weight:700;font-size:.87rem;cursor:pointer;border:1px solid transparent}
  .btn.primary{background:var(--sf-blue);color:#fff}.btn.primary:hover{background:#015fb0}
  .btn.good{background:var(--good);color:#fff}.btn.good:hover{background:#246b3c}
  .btn.ghost{background:var(--panel);color:var(--sf-blue-dark);border-color:var(--line)}.btn.ghost:hover{background:#F0F5FB}
  .btn.text{background:none;color:var(--ink-soft);border:none;padding:9px 6px}

  /* done group */
  .handled-group{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .hg-head{display:flex;align-items:center;gap:10px;padding:13px 18px;cursor:pointer;font-size:.9rem;color:var(--ink-soft)}
  .hg-head .ck{color:var(--good);font-weight:800}
  .hg-head .arrow{margin-left:auto;transition:transform .25s ease}
  .handled-group.open .hg-head .arrow{transform:rotate(90deg)}
  .hg-body{max-height:0;overflow:hidden;transition:max-height .3s ease}
  .handled-group.open .hg-body{max-height:340px}
  .hrow{display:flex;align-items:center;gap:10px;padding:11px 18px;border-top:1px solid #F0F3F8;font-size:.86rem;color:var(--ink-soft)}
  .hrow b{color:var(--ink);font-weight:600}
  .undo{margin-left:auto;font-size:.78rem;font-weight:700;color:var(--sf-blue);cursor:pointer}

  /* ===== FOCUS view ===== */
  .fback{display:inline-flex;align-items:center;gap:7px;color:var(--sf-blue);font-weight:700;font-size:.9rem;cursor:pointer;margin-bottom:16px}
  .fhead{display:flex;align-items:flex-start;gap:12px;margin-bottom:6px}
  .fhead .ctitle{font-size:1.25rem}
  .accordion{border:1px solid var(--line);border-radius:12px;background:var(--panel);margin:16px 0;overflow:hidden}
  .acc-head{display:flex;align-items:center;gap:9px;padding:12px 15px;cursor:pointer;font-weight:700;font-size:.9rem;color:var(--sf-blue-dark)}
  .acc-head .arrow{margin-left:auto;transition:transform .25s ease}
  .accordion.open .acc-head .arrow{transform:rotate(90deg)}
  .acc-body{max-height:0;overflow:hidden;transition:max-height .3s ease}
  .accordion.open .acc-body{max-height:360px}
  .src{display:flex;gap:9px;align-items:flex-start;padding:10px 15px;border-top:1px solid #F0F3F8;font-size:.86rem}
  .src .tag{font-size:.62rem;font-weight:800;padding:3px 7px;border-radius:5px;background:#EEF2FA;color:var(--ink-soft);flex:none}

  .planbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:16px}
  .planbox .pb-h{padding:12px 16px;font-weight:700;font-size:.82rem;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-soft);border-bottom:1px solid #EEF2F8}
  .brow{display:flex;align-items:center;gap:10px;padding:9px 16px;border-bottom:1px solid #F1F4F9;font-size:.88rem}
  .brow:last-child{border-bottom:none}
  .chan{font-size:.62rem;font-weight:800;padding:3px 7px;border-radius:5px;flex:none}
  .chan.teams{background:#E6E2FB;color:#5B4BBE}.chan.email{background:#DDF1EE;color:#0A6E66}
  .brow .bwho{font-weight:700;min-width:120px;color:var(--ink)} .brow .bgist{color:var(--ink-soft)}
  .factrow{padding:10px 16px;border-bottom:1px solid #F1F4F9;font-size:.9rem;color:var(--ink-soft)}
  .factrow b{color:var(--ink)}
  .asset{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid #F1F4F9;font-size:.88rem}
  .asset .ai{width:28px;height:28px;border-radius:7px;background:#EEF4FF;color:var(--sf-blue);display:grid;place-items:center;flex:none}
  .asset .link{margin-left:auto;color:var(--sf-blue);font-weight:700;font-size:.8rem;cursor:pointer}

  /* per-item thread */
  .threadbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:16px}
  .threadbox .tb-h{padding:12px 16px;font-weight:700;font-size:.82rem;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-soft);border-bottom:1px solid #EEF2F8}
  .tmsgs{padding:14px 16px;display:flex;flex-direction:column;gap:12px;max-height:300px;overflow-y:auto}
  .tmsg{display:flex;gap:10px}
  .tmsg .w{width:26px;height:26px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:.7rem;font-weight:800;color:#fff}
  .tmsg.j .w{background:radial-gradient(circle at 35% 30%,#8E7BF0,#5B4BBE 70%)}
  .tmsg.u{flex-direction:row-reverse}.tmsg.u .w{background:var(--sf-blue)}
  .tbub{background:#F7F9FC;border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:.9rem;line-height:1.45;max-width:80%}
  .tmsg.u .tbub{background:#E5EEF8;border-color:#CFE0F4}
  .tinput{display:flex;gap:8px;padding:10px 12px;border-top:1px solid #EEF2F8}
  .tinput input{flex:1;border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:.9rem;font-family:var(--font);outline:none}
  .tinput input:focus{border-color:var(--sf-blue)}
  .tinput .send{width:38px;height:38px;border-radius:10px;background:var(--sf-blue);color:#fff;display:grid;place-items:center;cursor:pointer}

  .factionbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;position:sticky;bottom:90px}

  /* ===== input bar ===== */
  .inputbar{position:fixed;bottom:0;left:0;right:0;padding:14px 20px 18px;background:linear-gradient(180deg,rgba(238,243,249,0),var(--bg) 38%);z-index:30}
  .inputbar .inner{max-width:740px;margin:0 auto;display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:5px 5px 5px 16px;box-shadow:var(--shadow);opacity:.8}
  .inputbar .inner:focus-within{opacity:1}
  .inputbar input{flex:1;border:none;outline:none;font-size:.92rem;font-family:var(--font);color:var(--ink);background:transparent;padding:9px 0}
  .inputbar .send{width:36px;height:36px;border-radius:10px;background:var(--sf-blue);color:#fff;display:grid;place-items:center;cursor:pointer}
  .inputbar .hintline{max-width:740px;margin:7px auto 0;text-align:center;font-size:.75rem;color:var(--ink-soft)}

  /* ===== skills panel ===== */
  .scrim{position:fixed;inset:0;background:rgba(3,24,52,.4);z-index:50;opacity:0;pointer-events:none;transition:opacity .25s ease}
  .scrim.open{opacity:1;pointer-events:auto}
  .panel{position:fixed;top:0;right:0;bottom:0;width:430px;max-width:92vw;background:var(--panel);z-index:60;box-shadow:-12px 0 40px rgba(3,45,96,.2);transform:translateX(100%);transition:transform .28s ease;display:flex;flex-direction:column}
  .panel.open{transform:translateX(0)}
  .panel .ph{display:flex;align-items:center;gap:10px;padding:18px 20px;border-bottom:1px solid var(--line)}
  .panel .ph h2{font-size:1.1rem;color:var(--sf-blue-dark)}
  .panel .pbody{overflow-y:auto;padding:8px 20px 24px}
  .panel .intro{font-size:.86rem;color:var(--ink-soft);margin:12px 0 6px;line-height:1.5}
  .skill{padding:14px 0;border-bottom:1px solid #F0F3F8}
  .skill .sn{font-weight:700;font-size:.95rem;color:var(--ink)}
  .skill .sd{font-size:.8rem;color:var(--ink-soft);margin:3px 0 9px;line-height:1.4}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
  .seg button{border:none;background:var(--panel);padding:6px 13px;font-size:.8rem;font-weight:700;color:var(--ink-soft);cursor:pointer}
  .seg button.on{background:var(--sf-blue);color:#fff}
  .seg button.on.auto{background:var(--good)}
  .teach{margin-top:16px;display:flex;align-items:center;gap:8px;padding:12px 14px;border:1.5px dashed #C5D5EA;border-radius:11px;color:var(--sf-blue);font-weight:700;font-size:.88rem;cursor:pointer}

  /* concept notes */
  .note{display:none;background:#021834;color:#E7F0FB;border-left:3px solid var(--accent);border-radius:9px;padding:11px 14px;margin:0 0 14px;font-size:.84rem;line-height:1.5}
  body.show-notes .note{display:block}
  .note b{color:var(--accent)}
</style>
</head>
<body>
  <div class="topbar">
    <div class="brand" onclick="back()"><span class="core"></span> Jarvis</div>
    <div class="spacer"></div>
    <div class="iconbtn" title="Search past items">🔍</div>
    <div class="chip cando" onclick="openSkills()">✦ What I can do</div>
    <div class="chip autopilot" onclick="openSkills()">⚡ <span id="autoCount">5</span> on autopilot</div>
    <div class="chip notes" onclick="document.body.classList.toggle('show-notes')">◆ Concept notes</div>
    <div class="iconbtn" title="Settings · trust default · connected tools">⚙</div>
  </div>

  <main id="view-stream" class="col"></main>
  <main id="view-focus" class="col hide"></main>

  <div class="inputbar" id="inputbar">
    <div class="inner">
      <input placeholder="Tell Jarvis something — you rarely need to." />
      <div class="send">↑</div>
    </div>
    <div class="hintline">Jarvis comes to you. The input is here for the exceptions.</div>
  </div>

  <div class="scrim" id="scrim" onclick="closeSkills()"></div>
  <aside class="panel" id="skillsPanel"></aside>

<script>
  /* ===== DATA: every item is the same object (Action Recommendation) ===== */
  let ITEMS = [
    {
      id:'marc', type:'jarvis-action', state:'needs', urgent:true,
      title:"I cleared 2 PM for Marc's review",
      sub:"Marc (SVP) outranks your afternoon · collided with 3 meetings · 7 messages drafted in your voice",
      lineage:[
        {tag:'CALENDAR', text:"Marc's invite — \u201cProduct review (mandatory)\u201d, today 2:00\u20133:00 PM."},
        {tag:'ORG RANK', text:"Marc is SVP, Product \u2014 outranks every attendee on your afternoon."},
        {tag:'CONFLICTS', text:"3 clashes detected: 1:1 w/ Sarah, sprint sync, Acme check-in."}
      ],
      plan:{kind:'messages', rows:[
        {chan:'teams', who:'Sarah', gist:'So sorry for the short notice \u2014 push our 1:1 to 4 PM?'},
        {chan:'teams', who:'Raj', gist:'Going to miss sprint sync \u2014 you\u2019ve got it, notes after?'},
        {chan:'teams', who:'Priya', gist:'Heads-up you\u2019ll join the review.'},
        {chan:'teams', who:'#product-platform', gist:'FYI \u2014 offline 2\u20133 PM.'},
        {chan:'email', who:'Vendor (Acme)', gist:'Reschedule \u2014 two new slots offered.'},
        {chan:'email', who:"Marc's EA", gist:'Confirming your attendance.'},
        {chan:'email', who:'Finance', gist:'Expense sign-off lands by EOD instead.'}
      ]},
      thread:[ {who:'j', text:"I worked out a fix and drafted all 7 messages in your voice. Take a look \u2014 edit anything, or ask me why I made a call. One send (declining Acme) is rank-sensitive, so I\u2019ll confirm that one with you."} ]
    },
    {
      id:'expense', type:'your-decision', state:'waityou',
      title:"Expense policy exception needs your sign-off",
      sub:"Only you can approve this one \u2014 due EOD. I\u2019ve summarised it so you can decide in seconds.",
      lineage:[
        {tag:'SOURCE', text:"Concur request #4471 \u2014 $1,420 client dinner, 2 over the per-head cap."},
        {tag:'POLICY', text:"T&E \u00a73.2: exceptions above cap need a director sign-off."}
      ],
      plan:{kind:'summary', facts:[
        "Amount: <b>$1,420</b> (cap allows $1,180).",
        "Reason: closing dinner with the Acme account \u2014 deal in final stage.",
        "Risk: low \u2014 within your quarterly discretionary budget."
      ], note:"My read: reasonable and well-justified. Your call."},
      thread:[ {who:'j', text:"This needs your judgment, not mine \u2014 it\u2019s a policy exception. Here\u2019s the gist; sign off, send it back for changes, or ask me anything about it."} ]
    },
    {
      id:'qbr', type:'assembled-context', state:'inflight',
      title:"Prepping your QBR with Marc",
      sub:"Pulling the deck, last quarter\u2019s numbers and the 4 people you\u2019ll need \u2014 ready by 11:30.",
      lineage:[ {tag:'TRIGGER', text:"Now that Marc\u2019s review is locked, you\u2019ll want to walk in prepared."} ],
      plan:{kind:'assembled', assets:[
        {ico:'\uD83D\uDCCA', label:'Q2 business review deck (last edited by you)', link:'Open'},
        {ico:'\uD83D\uDCC8', label:'Q2 metrics vs target \u2014 auto-compiled', link:'Open'},
        {ico:'\uD83D\uDC65', label:'4 people you\u2019ll need: Raj, Priya, Sarah, Finance', link:'Message'},
        {ico:'\uD83D\uDCAC', label:'#product-platform \u2014 thread of open decisions', link:'Open'}
      ]},
      thread:[ {who:'j', text:"I\u2019m assembling everything for the QBR so it\u2019s in one place. I\u2019ll ping you the moment it\u2019s ready \u2014 nothing for you to do yet."} ]
    },
    {
      id:'pto', type:'tracking', state:'tracking',
      title:"Following up on your PTO approval",
      sub:"Sent to your manager Monday. No reply yet \u2014 I\u2019ll nudge Thursday AM if it\u2019s still open.",
      lineage:[ {tag:'WORKDAY', text:"PTO request Jun 24\u201326 submitted Mon 9:04 AM, status: pending manager."} ],
      plan:{kind:'summary', facts:[
        "Sent: Monday 9:04 AM to Dana (your manager).",
        "Status: <b>awaiting approval</b> \u2014 2 days open.",
        "My plan: auto-nudge Thursday 9 AM, then tell you either way."
      ], note:"You don\u2019t need to do anything \u2014 I\u2019m watching it."},
      thread:[ {who:'j', text:"I\u2019ve got an eye on this. Want me to nudge Dana now instead of Thursday?"} ]
    }
  ];

  const HANDLED = [
    {v:'Booked', t:'the room for Thursday\u2019s design sync'},
    {v:'Filed', t:'your Q2 training completion'},
    {v:'Declined', t:'a duplicate vendor invite'},
    {v:'Drafted', t:'the weekly status for your review'}
  ];

  let SKILLS = [
    {id:'rooms', name:'Book rooms for recurring syncs', desc:'When a recurring meeting has no room, I find and book one.', trust:'auto'},
    {id:'training', name:'File training completions', desc:'Mark required training done in Workday when you finish it.', trust:'auto'},
    {id:'invites', name:'Decline duplicate / spam invites', desc:'Turn down obvious duplicates and no-agenda holds.', trust:'auto'},
    {id:'triage', name:'Snooze low-priority threads to the brief', desc:'Hold non-urgent messages for your morning brief.', trust:'auto'},
    {id:'status', name:'Draft your weekly status', desc:'Compile your update from activity \u2014 you review and send.', trust:'draft'},
    {id:'reschedule', name:'Reschedule around higher-rank meetings', desc:'Draft the full reshuffle when someone senior books over you.', trust:'draft'},
    {id:'summarise', name:'Summarise long email threads', desc:'Condense any thread on request.', trust:'ask'},
    {id:'expense', name:'Approve routine expenses under cap', desc:'Sign off in-policy expenses on your behalf.', trust:'ask'}
  ];

  let view='stream', focusId=null;

  /* ===== helpers ===== */
  const byState = s => ITEMS.filter(i=>i.state===s);
  const stateMeta = {
    needs:{pill:'Needs you', cls:'needs'}, waityou:{pill:'Needs you', cls:'waityou'},
    inflight:{pill:'Working', cls:'inflight', pulse:true}, tracking:{pill:'Tracking', cls:'tracking', pulse:true}
  };

  function actionsFor(it){
    if(it.type==='jarvis-action') return '<div class="btn primary" onclick="event.stopPropagation();approve(\''+it.id+'\')">Approve all &amp; send</div><div class="btn text" onclick="event.stopPropagation();snooze(\''+it.id+'\')">Not now</div>';
    if(it.type==='your-decision') return '<div class="btn good" onclick="event.stopPropagation();markDone(\''+it.id+'\')">Sign off &amp; done</div><div class="btn ghost" onclick="event.stopPropagation();openFocus(\''+it.id+'\')">Read &amp; discuss</div>';
    if(it.type==='tracking') return '<div class="btn ghost" onclick="event.stopPropagation();nudge(\''+it.id+'\')">Nudge now</div><div class="btn text" onclick="event.stopPropagation();markDone(\''+it.id+'\')">Mark resolved</div>';
    return '';
  }

  /* ===== STREAM ===== */
  function renderStream(){
    const needs = ITEMS.filter(i=>i.state==='needs'||i.state==='waityou');
    const working = byState('inflight');
    const tracking = byState('tracking');
    let h = '';

    if(needs.length===0){
      h += '<div class="allclear"><div class="big">You\u2019re clear for now.</div><p>Nothing needs you. I\u2019m watching '+(working.length+tracking.length)+' things and will pull you in only if something changes.</p></div>';
    } else {
      h += '<div class="status"><h1>Good morning, Pritesh.</h1><p>I protected your afternoon for Marc \u2014 it needs your OK. '+(needs.length-1>0?(needs.length-1)+' more thing'+(needs.length-1>1?'s':'')+' need you. ':'')+'Everything else I\u2019ve got.</p></div>';
      h += '<div class="note">Resting state = a status + only what needs you. No tabs, no triage list. Tap any card to go deep, discuss, and act.</div>';
      h += '<div class="seclabel">Needs you <span class="ct">'+needs.length+'</span></div>';
      needs.forEach(it=> h += cardHTML(it));
    }

    if(working.length){
      h += '<div class="seclabel">Working on it <span class="ct">'+working.length+'</span></div>';
      h += '<div class="note"><b>The missing middle.</b> \u201cOn it, ready by 11:30\u201d \u2014 the EA dance. First-class state, not a hidden spinner.</div>';
      working.forEach(it=> h += cardHTML(it));
    }
    if(tracking.length){
      h += '<div class="seclabel">Tracking <span class="ct">'+tracking.length+'</span></div>';
      h += '<div class="note"><b>Waiting on others.</b> Jarvis sent it and is watching for the reply \u2014 so you never wonder \u201cdid that actually happen?\u201d</div>';
      tracking.forEach(it=> h += cardHTML(it));
    }

    h += '<div class="seclabel">Handled '+(allClearBonus())+'<span class="ct">'+HANDLED.length+'</span></div>';
    h += '<div class="note"><b>The receipt is the product.</b> Done work collapses to quiet, reversible one-liners \u2014 proof, never clutter.</div>';
    h += '<div class="handled-group" id="handledGroup"><div class="hg-head" onclick="document.getElementById(\'handledGroup\').classList.toggle(\'open\')"><span class="ck">\u2713</span> I handled '+HANDLED.length+' things while you were away \u2014 all reversible <span class="arrow">\u203A</span></div><div class="hg-body">';
    HANDLED.forEach(x=> h += '<div class="hrow"><span style="color:var(--good);font-weight:800">\u2713</span><span><b>'+x.v+'</b> '+x.t+'</span><span class="undo">Undo</span></div>');
    h += '</div></div>';

    document.getElementById('view-stream').innerHTML = h;
  }
  function allClearBonus(){ return ''; }

  function cardHTML(it){
    const m = stateMeta[it.state]||stateMeta.needs;
    const pulse = m.pulse?'<span class="pulse"></span> ':'';
    let inner = '<div class="chead"><div class="jdot">J</div><div><div class="ctitle">'+it.title+'</div><div class="csub">'+it.sub+'</div></div><span class="statepill '+m.cls+'">'+pulse+m.pill+'</span></div>';
    if(it.state==='inflight') inner += '<div class="progress"><div class="bar"></div></div>';
    const acts = actionsFor(it);
    if(acts) inner += '<div class="cfoot">'+acts+'<span class="gatehint">Tap to open &amp; discuss \u2192</span></div>';
    return '<div class="card click '+m.cls+(it.urgent?' urgent':'')+'" onclick="openFocus(\''+it.id+'\')">'+inner+'</div>';
  }

  /* ===== FOCUS ===== */
  function openFocus(id){
    focusId=id; view='focus';
    const it = ITEMS.find(i=>i.id===id);
    const m = stateMeta[it.state]||stateMeta.needs;
    let h = '<div class="fback" onclick="back()">\u2190 Back to your day</div>';
    h += '<div class="fhead"><div class="jdot" style="width:34px;height:34px">J</div><div><div class="ctitle">'+it.title+'</div><div class="csub">'+it.sub+'</div></div><span class="statepill '+m.cls+'">'+(m.pulse?'<span class="pulse"></span> ':'')+m.pill+'</span></div>';

    // what I read
    h += '<div class="accordion" id="accLin"><div class="acc-head" onclick="document.getElementById(\'accLin\').classList.toggle(\'open\')">\uD83D\uDD0D What I read <span class="arrow">\u203A</span></div><div class="acc-body">';
    it.lineage.forEach(l=> h += '<div class="src"><span class="tag">'+l.tag+'</span><span>'+l.text+'</span></div>');
    h += '</div></div>';

    // plan
    h += planHTML(it);

    // per-item thread
    h += '<div class="threadbox"><div class="tb-h">Conversation about this</div><div class="tmsgs" id="tmsgs">';
    it.thread.forEach(t=> h += tmsgHTML(t));
    h += '</div><div class="tinput"><input id="tInput" placeholder="Ask about this, or tell me to change it\u2026" onkeydown="if(event.key===\'Enter\')sendThread()"><div class="send" onclick="sendThread()">\u2191</div></div></div>';

    // actions
    const acts = actionsFor(it) || '<span class="gatehint" style="margin-left:0">I\u2019m on this \u2014 nothing for you to do yet.</span>';
    h += '<div class="factionbar">'+acts+'</div>';

    document.getElementById('view-focus').innerHTML = h;
    document.getElementById('view-stream').classList.add('hide');
    document.getElementById('view-focus').classList.remove('hide');
    window.scrollTo(0,0);
  }
  function planHTML(it){
    const p = it.plan;
    if(p.kind==='messages'){
      let r = '<div class="planbox"><div class="pb-h">The plan \u2014 7 messages, editable</div>';
      p.rows.forEach(x=> r += '<div class="brow"><span class="chan '+x.chan+'">'+x.chan.toUpperCase()+'</span><span class="bwho">'+x.who+'</span><span class="bgist">'+x.gist+'</span></div>');
      return r+'</div>';
    }
    if(p.kind==='summary'){
      let r = '<div class="planbox"><div class="pb-h">Summary</div>';
      p.facts.forEach(f=> r += '<div class="factrow">'+f+'</div>');
      if(p.note) r += '<div class="factrow" style="background:#FAFCFE"><b>Jarvis:</b> '+p.note+'</div>';
      return r+'</div>';
    }
    if(p.kind==='assembled'){
      let r = '<div class="planbox"><div class="pb-h">Assembled for you</div>';
      p.assets.forEach(a=> r += '<div class="asset"><span class="ai">'+a.ico+'</span><span>'+a.label+'</span><span class="link">'+a.link+'</span></div>');
      return r+'</div>';
    }
    return '';
  }
  function tmsgHTML(t){ return '<div class="tmsg '+t.who+'"><div class="w">'+(t.who==='j'?'J':'P')+'</div><div class="tbub">'+t.text+'</div></div>'; }

  function sendThread(){
    const inp = document.getElementById('tInput'); const txt = inp.value.trim(); if(!txt) return;
    const it = ITEMS.find(i=>i.id===focusId);
    it.thread.push({who:'u', text:txt});
    const low = txt.toLowerCase();
    let reply = "Got it \u2014 I\u2019ve noted that and updated the plan above.";
    if(low.includes('sarah')&&(low.includes('thursday')||low.includes('9'))) reply = "Done \u2014 I offered Sarah Thursday 9 AM instead and updated her message. The rest of the batch is untouched.";
    else if(low.includes('why')) reply = "Marc outranks everyone on your afternoon and tagged the review mandatory, so I protected that slot and moved the lower-priority items around it.";
    else if(low.includes('acme')||low.includes('vendor')) reply = "I chose to decline-with-offer rather than move it because Acme has no hard dependency today \u2014 want me to propose two specific slots instead?";
    else if(low.includes('nudge')) reply = "Sent a gentle nudge just now. I\u2019ll tell you the moment they reply.";
    it.thread.push({who:'j', text:reply});
    // re-render thread only
    const box = document.getElementById('tmsgs');
    box.innerHTML = it.thread.map(tmsgHTML).join('');
    box.scrollTop = box.scrollHeight;
    inp.value='';
  }

  function back(){
    view='stream'; focusId=null;
    document.getElementById('view-focus').classList.add('hide');
    document.getElementById('view-stream').classList.remove('hide');
    renderStream();
  }

  /* ===== lifecycle transitions ===== */
  function approve(id){
    const it = ITEMS.find(i=>i.id===id);
    it.state='inflight'; it.title='Sending 7 messages to clear your afternoon\u2026'; it.sub='4 Teams \u00b7 3 emails \u00b7 holding the rank-sensitive send for your confirm';
    if(view==='focus') back(); else renderStream();
    setTimeout(()=>{
      it.state='tracking'; it.type='tracking';
      it.title='Cleared your afternoon \u2014 waiting on 2 replies';
      it.sub='Sent all 7. Sarah & Acme haven\u2019t confirmed yet \u2014 I\u2019ll nudge at 2 and tell you.';
      it.plan={kind:'summary', facts:['Sent: 4 Teams + 3 emails just now.','Confirmed: Raj, Priya, Marc\u2019s EA, Finance.','<b>Waiting:</b> Sarah (1:1 move), Acme (reschedule).'], note:'Your 2 PM is locked regardless \u2014 these are just courtesy confirms.'};
      it.thread.push({who:'j', text:'All 7 are out and your 2 PM is locked. I\u2019ll close the loop when Sarah and Acme reply.'});
      renderStream();
      toast('Sent. Your 2 PM is clear for Marc.');
    }, 1800);
  }
  function nudge(id){ toast('Nudged \u2014 I\u2019ll tell you the moment they reply.'); }
  function snooze(id){ const it=ITEMS.find(i=>i.id===id); it._hidden=true; ITEMS=ITEMS.filter(i=>i.id!==id); toast('Snoozed \u2014 back in your next brief.'); if(view==='focus') back(); else renderStream(); }
  function markDone(id){
    ITEMS = ITEMS.filter(i=>i.id!==id);
    HANDLED.unshift({v:'Resolved', t:(id==='expense'?'the expense exception sign-off':'an item you cleared')});
    if(view==='focus') back(); else renderStream();
    toast('Done \u2014 logged, and reversible.');
    const remaining = ITEMS.filter(i=>i.state==='needs'||i.state==='waityou').length;
    if(remaining===0) setTimeout(()=> toast('That\u2019s everything that needed you. Your day\u2019s clear.'),700);
  }

  /* ===== toast ===== */
  function toast(msg){
    let t=document.createElement('div'); t.textContent=msg;
    t.style.cssText='position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#021834;color:#fff;padding:11px 18px;border-radius:10px;font-size:.9rem;font-weight:600;z-index:80;box-shadow:0 8px 30px rgba(0,0,0,.3);opacity:0;transition:opacity .2s ease';
    document.body.appendChild(t); requestAnimationFrame(()=>t.style.opacity='1');
    setTimeout(()=>{t.style.opacity='0';setTimeout(()=>t.remove(),250)},2200);
  }

  /* ===== skills / trust / autopilot (one reconciled system) ===== */
  function renderSkills(){
    let h = '<div class="ph"><span class="core"></span><h2>What I can do</h2><div class="spacer" style="flex:1"></div><div class="iconbtn" onclick="closeSkills()">\u2715</div></div><div class="pbody">';
    h += '<div class="intro">Every skill has a trust level you control. <b>Auto</b> = I just do it (your autopilot). <b>Draft</b> = I prepare it, you send. <b>Ask</b> = I check first. Trust grows as we work \u2014 pull anything back anytime.</div>';
    SKILLS.forEach(s=>{
      h += '<div class="skill"><div class="sn">'+s.name+'</div><div class="sd">'+s.desc+'</div><div class="seg">'+
        seg(s.id,'ask',s.trust)+seg(s.id,'draft',s.trust)+seg(s.id,'auto',s.trust)+'</div></div>';
    });
    h += '<div class="teach">\uFF0B Teach Jarvis something new</div>';
    h += '</div>';
    document.getElementById('skillsPanel').innerHTML = h;
    updateAutoCount();
  }
  function seg(id,level,cur){ const on = level===cur; return '<button class="'+(on?'on '+(level==='auto'?'auto':''):'')+'" onclick="setTrust(\''+id+'\',\''+level+'\')">'+level.charAt(0).toUpperCase()+level.slice(1)+'</button>'; }
  function setTrust(id,level){ const s=SKILLS.find(x=>x.id===id); s.trust=level; renderSkills(); }
  function updateAutoCount(){ document.getElementById('autoCount').textContent = SKILLS.filter(s=>s.trust==='auto').length; }
  function openSkills(){ renderSkills(); document.getElementById('scrim').classList.add('open'); document.getElementById('skillsPanel').classList.add('open'); }
  function closeSkills(){ document.getElementById('scrim').classList.remove('open'); document.getElementById('skillsPanel').classList.remove('open'); }

  /* init */
  renderStream(); updateAutoCount();
</script>
</body>
</html>
